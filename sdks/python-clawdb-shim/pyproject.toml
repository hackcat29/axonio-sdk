[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawdb"
version = "0.2.0"
description = "Renamed to axonio. This package installs axonio and keeps `import clawdb` working."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["axonio", "ai", "agents", "memory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["axonio>=0.2.0"]

[project.urls]
Homepage = "https://axonio.xyz"

[tool.hatch.build.targets.wheel]
packages = ["clawdb"]
