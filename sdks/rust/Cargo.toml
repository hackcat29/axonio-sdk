[package]
name = "axonio"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["Axonio"]
description = "Rust client for Axonio: persistent memory for AI agents (formerly clawdb-client)."
license = "Apache-2.0"
repository = "https://github.com/hackcat29/axonio-sdk"
homepage = "https://axonio.xyz"
documentation = "https://docs.rs/axonio"
readme = "README.md"
keywords = ["ai", "agents", "memory", "database", "axonio"]
categories = ["api-bindings", "database"]

[lib]
name = "axonio"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.38", features = ["time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }
